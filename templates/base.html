<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard{% endblock %}</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            display: flex;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            padding: 20px;
            position: fixed;
        }

        .sidebar h3 {
            border-bottom: 1px solid white;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 8px 0;
            text-decoration: none;
            margin-left: 10px;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .dropdown-menu {
            background-color: #2c3e50;
        }

        .dropdown-menu .dropdown-item {
            color: white;
        }

        .dropdown-menu .dropdown-item:hover {
            background-color: #34495e;
        }

        .content {
            margin-left: 240px;
            padding: 30px;
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <!-- Instagram Section -->
        <h3>Instagram</h3>
        <a href="{{ url_for('instagram.dashboard') }}">Kelola Data</a>
        <div class="dropdown">
            <a class="nav-link dropdown-toggle text-white" href="#" id="dropdownInstagramClustering" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Clustering
            </a>
            <ul class="dropdown-menu border-0" aria-labelledby="dropdownInstagramClustering">
                <li><a class="dropdown-item" href="{{ url_for('instagram.proses_clustering') }}">Proses Clustering</a></li>
                <li><a class="dropdown-item" href="{{ url_for('instagram.hasil_clustering') }}">Hasil Clustering</a></li>
            </ul>
        </div>
        <a href="{{ url_for('instagram.evaluasi') }}">Evaluasi</a>

        <!-- TikTok Section -->
        <h3>TikTok</h3>
        <a href="{{ url_for('tiktok.index') }}">Kelola Data</a>
        <a href="{{ url_for('tiktok.clustering') }}">Clustering</a>
        <a href="{{ url_for('tiktok.evaluasi') }}">Evaluasi</a>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
