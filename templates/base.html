<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            display: flex;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 220px;
            background-color: #8e44ad; /* Warna ungu branding */
            color: white;
            height: 100vh;
            padding: 20px;
            position: fixed;
        }

        .sidebar h3 {
            border-bottom: 1px solid white;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 8px 0;
            text-decoration: none;
            margin-left: 10px;
            transition: background-color 0.3s, padding-left 0.3s;
        }

        .sidebar a:hover {
            background-color: #732d91; /* Ungu lebih gelap saat hover */
            text-decoration: none;
            border-radius: 5px;
            padding-left: 15px;
        }

        .dropdown-menu {
            background-color: #8e44ad;
        }

        .dropdown-menu .dropdown-item {
            color: white;
        }

        .dropdown-menu .dropdown-item:hover {
            background-color: #732d91;
        }

        .content {
            margin-left: 240px;
            padding: 30px;
            flex-grow: 1;
            width: 100%;
        }

        .logout-link {
            color: white;
            text-decoration: none;
            margin-left: 10px;
            display: block;
            padding: 8px 0;
            transition: background-color 0.3s, padding-left 0.3s;
        }

        .logout-link:hover {
            background-color: #732d91;
            text-decoration: none;
            border-radius: 5px;
            padding-left: 15px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a class="nav-link" href="{{ url_for('dashboard') }}">
            <i class="fas fa-home"></i> Dashboard
        </a>

        <!-- Instagram Section -->
        <h3>Instagram</h3>
        <a href="{{ url_for('instagram.dashboard') }}">Kelola Data</a>
        <div class="dropdown">
            <a class="nav-link dropdown-toggle text-white" href="#" id="dropdownInstagramClustering" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Clustering
            </a>
            <ul class="dropdown-menu border-0" aria-labelledby="dropdownInstagramClustering">
                <li><a class="dropdown-item" href="{{ url_for('instagram.proses_clustering') }}">Proses Clustering</a></li>
                <li><a class="dropdown-item" href="{{ url_for('instagram.hasil_clustering') }}">Hasil Clustering</a></li>
            </ul>
        </div>

        <!-- TikTok Section -->
        <h3>TikTok</h3>
        <a href="{{ url_for('tiktok.index') }}">Kelola Data</a>
        <div class="dropdown">
            <a class="nav-link dropdown-toggle text-white" href="#" id="dropdownTiktokClustering" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Clustering
            </a>
            <ul class="dropdown-menu border-0" aria-labelledby="dropdownTiktokClustering">
                <li><a class="dropdown-item" href="{{ url_for('tiktok.proses_clustering') }}">Proses Clustering</a></li>
                <li><a class="dropdown-item" href="{{ url_for('tiktok.hasil_clustering') }}">Hasil Clustering</a></li>
            </ul>
        </div>

        <!-- Logout Link -->
        <a class="logout-link" href="{{ url_for('logout') }}">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
